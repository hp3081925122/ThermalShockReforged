pluginManagement {
    repositories {
        // 使用 NeoForge ModDevGradle 插件所需的官方仓库。
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'thermal_shock_reforged'
