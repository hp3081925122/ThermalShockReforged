// 当前文件只保留 26.1.2 NeoForge 的构建、开发运行和资源处理配置。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// GameTest 与百科导出代码独立成源集，只进入开发运行，不进入发布 jar。
sourceSets {
    gametest {
        java.srcDirs = ['src/gametest/java']
        resources.srcDirs = ['src/gametest/resources']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version

    interfaceInjectionData {
        from(file('gradle/interface_injections/geckolib.json'))
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 百科图标导出：带 gametest 源集启动客户端，在标题界面渲染指定物品后自动退出。
        wikiIconClient {
            client()
            systemProperty 'tsr.wikiIcons', (project.findProperty('wikiIcons') ?: '').toString()
            systemProperty 'tsr.wikiIconRotY', (project.findProperty('wikiIconRotY') ?: '').toString()
            systemProperty 'tsr.wikiIconDir', (project.findProperty('wikiIconDir') ?: 'D:/AI临时文件/icons_render').toString()
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    implementation 'curse.maven:geckolib-388172:8327201'
    implementation 'curse.maven:jei-238222:8771077'
    implementation 'curse.maven:just-enough-characters-250702:8413185'
    implementation 'curse.maven:jade-324717:8651070'
    implementation 'curse.maven:advanced-loot-info-1205426:8169069'
}

tasks.withType(ProcessResources).configureEach {
    def utf8ModProperties = new Properties()
    project.file('gradle.properties').withReader('UTF-8') { utf8ModProperties.load(it) }
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: utf8ModProperties.getProperty('mod_description', project.mod_description)
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// 原作 MIT 许可要求分发副本保留版权声明，随成品一并打包。
tasks.named('jar') {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.mod_id}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

