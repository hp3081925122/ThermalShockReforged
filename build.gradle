// 当前文件只保留最小的 NeoForge 开发、构建和运行配置。
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.37'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 开发辅助模组只进入本地运行类路径，不作为成品的传递依赖发布。
configurations {
    developmentRuntime {
        canBeConsumed = false
        canBeResolved = false
    }
    runtimeClasspath.extendsFrom developmentRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    implementation 'curse.maven:geckolib-388172:8350073'
    implementation 'curse.maven:aaa-particles-979809:9101011'
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.21.0.247"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    developmentRuntime "mezz.jei:jei-1.21.1-neoforge:19.27.0.346"
    developmentRuntime "curse.maven:just-enough-characters-250702:8117474"
    compileOnly "curse.maven:jade-324717:8591319"
    developmentRuntime "curse.maven:jade-324717:8591319"
}

tasks.withType(ProcessResources).configureEach {
    def utf8ModProperties = new Properties()
    project.file('gradle.properties').withReader('UTF-8') { utf8ModProperties.load(it) }
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: gradle.startParameter.projectProperties.get('mod_description') ?: utf8ModProperties.getProperty('mod_description', project.mod_description)
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    gametest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly, developmentRuntime
}

runs {
    gameTestServer {
        modSource sourceSets.gametest
    }
}

// 离线产物门禁检查真实成品，避免混入旧加载器、测试代码或丢失主输出。
def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies the NeoForge release archive without starting Minecraft.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    inputs.files(sourceSets.main.output)
    def reportFile = layout.buildDirectory.file('validation/release-jar.json')
    outputs.file(reportFile)
    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        def counts = [entries: 0, classes: 0, json: 0, matchedMainOutputs: 0]
        new java.util.jar.JarFile(archive).withCloseable { jar ->
            def entries = jar.entries().toList().findAll { !it.directory }
            def names = entries.collect { it.name }
            if (names.size() != names.toSet().size()) throw new GradleException('Duplicate release JAR entries')
            counts.entries = names.size()
            if (!names.contains('META-INF/neoforge.mods.toml') || names.any { it in ['META-INF/mods.toml', 'fabric.mod.json', 'quilt.mod.json'] }) {
                throw new GradleException('Release must contain only NeoForge loader metadata')
            }
            if (names.any { it.endsWith('.jar') || it.endsWith('.java') || it.endsWith('.log') || it.startsWith('docs/') || it.startsWith('src/') || it.contains('/gametest/') || it.endsWith('/migration_empty.nbt') }) {
                throw new GradleException('Development files or embedded dependencies leaked into release JAR')
            }
            // 检查UTF-8元数据和引用入口，不改动或省略任何原资源。
            ['META-INF/neoforge.mods.toml', 'pack.mcmeta'].each { path ->
                def entry = jar.getJarEntry(path)
                if (entry == null) throw new GradleException("Missing release metadata: ${path}")
                def value = jar.getInputStream(entry).getText('UTF-8')
                if (value.contains('$' + '{') || value.contains('\uFFFD')) throw new GradleException("Invalid expanded metadata: ${path}")
            }
            def parser = new groovy.json.JsonSlurper()
            entries.each { entry ->
                byte[] value = jar.getInputStream(entry).bytes
                if (entry.name.endsWith('.json') || entry.name == 'pack.mcmeta') {
                    parser.parseText(new String(value, java.nio.charset.StandardCharsets.UTF_8))
                    counts.json++
                }
                if (entry.name.endsWith('.class')) {
                    if (!entry.name.startsWith('com/hp/thermalshockreforged/')) throw new GradleException("Unexpected bundled class: ${entry.name}")
                    int major = ((value[6] & 255) << 8) | (value[7] & 255)
                    if (major != 65) throw new GradleException("Release class is not Java 21: ${entry.name}")
                    if (new String(value, java.nio.charset.StandardCharsets.ISO_8859_1).contains('net/minecraftforge/')) throw new GradleException("Forge class reference in release: ${entry.name}")
                    counts.classes++
                }
            }
            // 比较完整主输出，确保未来构建也不会静默漏打资源或类。
            sourceSets.main.output.asFileTree.visit { detail ->
                if (!detail.directory) {
                    def entry = jar.getJarEntry(detail.relativePath.pathString)
                    if (entry == null || !java.util.Arrays.equals(detail.file.bytes, jar.getInputStream(entry).bytes)) {
                        throw new GradleException("Release differs from main output: ${detail.relativePath}")
                    }
                    counts.matchedMainOutputs++
                }
            }
            def mixins = parser.parseText(jar.getInputStream(jar.getJarEntry(project.mod_id + '.mixins.json')).getText('UTF-8'))
            (mixins.mixins + mixins.client).each { name ->
                def path = mixins.package.replace('.', '/') + '/' + name + '.class'
                if (!names.contains(path)) throw new GradleException("Missing release mixin: ${path}")
            }
        }
        def output = reportFile.get().asFile
        output.parentFile.mkdirs()
        def result = [archive: archive.absolutePath, sha256: java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString(), counts: counts, neoVersion: project.neo_version, gameStarted: false]
        output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(result)), 'UTF-8')
        logger.lifecycle("NeoForge release archive verified: ${archive.name}")
    }
}
tasks.named('check') { dependsOn verifyReleaseJar }

// 本地与仓库发布共用产物门禁，避免绕过构建检查。
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach { dependsOn verifyReleaseJar }
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenLocal).configureEach { dependsOn verifyReleaseJar }
