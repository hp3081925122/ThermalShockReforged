// 当前文件只保留最小的 NeoForge 开发、构建和运行配置。
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.37'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    implementation 'curse.maven:geckolib-388172:8350073'
    implementation 'curse.maven:aaa-particles-979809:9101011'
    implementation "mezz.jei:jei-1.21.1-neoforge:19.27.0.346"
    implementation "curse.maven:just-enough-characters-250702:8117474"
    implementation "curse.maven:jade-324717:8591319"
}

tasks.withType(ProcessResources).configureEach {
    def utf8ModProperties = new Properties()
    project.file('gradle.properties').withReader('UTF-8') { utf8ModProperties.load(it) }
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: gradle.startParameter.projectProperties.get('mod_description') ?: utf8ModProperties.getProperty('mod_description', project.mod_description)
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    gametest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

runs {
    gameTestServer {
        modSource sourceSets.gametest
        systemProperty 'neoneoforge.enabledGameTestNamespaces', project.mod_id
    }
}
